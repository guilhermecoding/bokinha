services:
  # --- SERVIÇO 1: O SITE (NEXT.JS) ---
  app:
    container_name: boquinha_app
    build: .
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Na rede Docker o host da base de dados é o serviço `db` (substitui DATABASE_URL do .env)
      DATABASE_URL: postgresql://boquinha:uhcc25@db:5432/bokinha
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Defina NEXTAUTH_SECRET no ficheiro .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      - db
    # Comando para garantir que as migrações rodem antes de iniciar o site (Opcional, mas recomendado)
    # command: sh -c "npx prisma db push && node server.js"
